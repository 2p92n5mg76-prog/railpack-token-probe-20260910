name: GITHUB_TOKEN PR approval semantics lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - github-token-pr-approval-probe.txt

permissions: {}

jobs:
  controller:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Create same-repository automation PR
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="token-pr-approval-lab-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          printf 'created by workflow run %s\n' "$GITHUB_RUN_ID" > github-token-pr-approval-probe.txt
          git add github-token-pr-approval-probe.txt
          git commit -m "test: GITHUB_TOKEN PR approval semantics"
          git push --set-upstream origin "$branch"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$branch" --title "Disposable GITHUB_TOKEN approval semantics probe" --body "Automated, self-cleaning test of current GitHub Actions approval behavior.")
          pr_number=$(basename "$pr_url")
          head_sha=$(git rev-parse HEAD)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Created PR $pr_number at $head_sha"
      - name: Find and approve generated pull-request run
        id: approve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.create.outputs.head_sha }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 90); do
            payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&per_page=100")
            run_id=$(printf '%s' "$payload" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          before=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.status, (.conclusion // "null")] | @tsv')
          echo "Found pull_request run $run_id before approval: $before"
          approval_rc=0
          approval_out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" 2>&1) || approval_rc=$?
          echo "Approve endpoint return code: $approval_rc"
          if [ "$approval_rc" -ne 0 ]; then
            printf '%s\n' "$approval_out"
            exit "$approval_rc"
          fi
          echo "approved_run_id=$run_id" >> "$GITHUB_OUTPUT"
          conclusion=""
          for attempt in $(seq 1 180); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.status, (.conclusion // "null")] | @tsv')
            echo "Run state: $state"
            status=$(printf '%s' "$state" | cut -f1)
            conclusion=$(printf '%s' "$state" | cut -f2)
            if [ "$status" = "completed" ]; then break; fi
            sleep 2
          done
          test "$conclusion" = "success"
      - name: Close PR and delete branch
        if: always() && steps.create.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
          BRANCH: ${{ steps.create.outputs.branch }}
        run: |
          set +e
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch
          close_rc=$?
          if [ "$close_rc" -ne 0 ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          fi
          exit "$close_rc"

  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm approved automation-created PR run
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          echo "Approved automation-created pull_request workflow executed successfully."
