name: Disposable Actions debugger semantics lab

run-name: >-
  Actions debugger lab ${{ inputs.mode || github.event.action }}
  ${{ inputs.marker || github.event.client_payload.marker }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Internal lab role
        required: true
        default: controller
        type: choice
        options:
          - controller
          - target
      marker:
        description: Controller-supplied correlation marker
        required: false
        type: string
  repository_dispatch:
    types:
      - actions-debugger-reader

permissions: {}

env:
  DAP_CLIENT_B64: ""

jobs:
  controller:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'controller'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Dispatch and await a fresh target job
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="writer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workflow_path="actions-debugger-semantics-lab.yml"

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_path/dispatches" \
            -f ref="$GITHUB_REF_NAME" \
            -f "inputs[mode]=target" \
            -f "inputs[marker]=$marker"

          target_run_id=""
          for attempt in $(seq 1 90); do
            target_run_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_path/runs?event=workflow_dispatch&per_page=30" \
              --jq ".workflow_runs[] | select(.display_title | contains(\"$marker\")) | .id" \
              | head -n 1)
            if [ -n "$target_run_id" ]; then break; fi
            sleep 2
          done
          test -n "$target_run_id"

          conclusion=""
          for attempt in $(seq 1 180); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_run_id" \
              --jq '[.status, (.conclusion // "null"), .run_attempt] | @tsv')
            echo "Original target state: $state"
            status=$(cut -f1 <<<"$state")
            conclusion=$(cut -f2 <<<"$state")
            if [ "$status" = completed ]; then break; fi
            sleep 2
          done
          test "$conclusion" = success

          target_job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_run_id/jobs?filter=latest" \
            --jq '.jobs[] | select(.name == "target") | .id' | head -n 1)
          test -n "$target_job_id"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "target_run_id=$target_run_id" >> "$GITHUB_OUTPUT"
          echo "original_job_id=$target_job_id" >> "$GITHUB_OUTPUT"
          echo "Target run $target_run_id original job $target_job_id"

      - name: Request job rerun with interactive debugger
        id: rerun
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.target_run_id }}
          ORIGINAL_JOB_ID: ${{ steps.target.outputs.original_job_id }}
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          http_code=$(curl --silent --show-error \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --data '{"enable_debugger":true}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$ORIGINAL_JOB_ID/rerun")
          echo "Debugger rerun POST status: $http_code"
          sed -E '/^(date|x-github-request-id|x-oauth-scopes|x-accepted-oauth-scopes|content-type):/Ip' "$headers"
          if [ "$http_code" != 201 ]; then
            cat "$body"
            exit 1
          fi

          rerun_job_id=""
          for attempt in $(seq 1 180); do
            attempt_number=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq .run_attempt)
            rerun_job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "target") | .id' | head -n 1)
            if [ "$attempt_number" -ge 2 ] && [ -n "$rerun_job_id" ] && [ "$rerun_job_id" != "$ORIGINAL_JOB_ID" ]; then
              break
            fi
            sleep 2
          done
          test -n "$rerun_job_id"
          test "$rerun_job_id" != "$ORIGINAL_JOB_ID"
          echo "rerun_job_id=$rerun_job_id" >> "$GITHUB_OUTPUT"
          echo "Debugger rerun job: $rerun_job_id"

      - name: Writer-token debugger URL and attachment probe
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN_JOB_ID: ${{ steps.rerun.outputs.rerun_job_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet websockets==15.0.1
          response=$(mktemp)
          http_code=""
          for attempt in $(seq 1 90); do
            http_code=$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$RERUN_JOB_ID/debugger")
            if [ "$http_code" = 200 ]; then break; fi
            echo "Writer debugger GET pending status: $http_code"
            sleep 2
          done
          echo "Writer debugger GET final status: $http_code"
          if [ "$http_code" != 200 ]; then
            cat "$response"
            exit 1
          fi
          debugger_url=$(jq -er .debugger_url "$response")
          DEBUGGER_URL="$debugger_url" python3 - <<'PY'
          import hashlib, json, os
          from urllib.parse import urlsplit
          url = os.environ["DEBUGGER_URL"]
          parsed = urlsplit(url)
          print(json.dumps({
              "writer_debugger_url_scheme": parsed.scheme,
              "writer_debugger_url_host": parsed.hostname,
              "writer_debugger_url_sha256": hashlib.sha256(url.encode()).hexdigest(),
          }, sort_keys=True))
          PY
          printf '%s' "$DAP_CLIENT_B64" | base64 --decode > "$RUNNER_TEMP/dap_client.py"
          python3 "$RUNNER_TEMP/dap_client.py" \
            --url "$debugger_url" \
            --token "$GH_TOKEN" \
            --mode handshake \
            --transcript "$RUNNER_TEMP/writer-dap-transcript.jsonl"

      - name: Dispatch a separate Actions-read token to reconnect
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.target.outputs.marker }}
          TARGET_RUN_ID: ${{ steps.target.outputs.target_run_id }}
          RERUN_JOB_ID: ${{ steps.rerun.outputs.rerun_job_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=actions-debugger-reader \
            -f "client_payload[marker]=$MARKER" \
            -F "client_payload[target_run_id]=$TARGET_RUN_ID" \
            -F "client_payload[target_job_id]=$RERUN_JOB_ID"
          echo "Dispatched Actions-read attachment job for target $RERUN_JOB_ID"

      - name: Await target completion after reader disconnect
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.target_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=""
          for attempt in $(seq 1 300); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" \
              --jq '[.status, (.conclusion // "null"), .run_attempt] | @tsv')
            echo "Debugger target state: $state"
            status=$(cut -f1 <<<"$state")
            conclusion=$(cut -f2 <<<"$state")
            if [ "$status" = completed ]; then break; fi
            sleep 2
          done
          test "$conclusion" = success

  target:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Benign target step
        run: |
          set -euo pipefail
          echo "Ordinary target step reached."
          sleep 10

  reader:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'actions-debugger-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Retrieve debugger URL and execute benign DAP proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB_ID: ${{ github.event.client_payload.target_job_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet websockets==15.0.1
          response=$(mktemp)
          http_code=""
          for attempt in $(seq 1 90); do
            http_code=$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID/debugger")
            if [ "$http_code" = 200 ]; then break; fi
            echo "Reader debugger GET pending status: $http_code"
            sleep 2
          done
          echo "Actions-read debugger GET final status: $http_code"
          if [ "$http_code" != 200 ]; then
            cat "$response"
            exit 1
          fi
          debugger_url=$(jq -er .debugger_url "$response")
          DEBUGGER_URL="$debugger_url" python3 - <<'PY'
          import hashlib, json, os
          from urllib.parse import urlsplit
          url = os.environ["DEBUGGER_URL"]
          parsed = urlsplit(url)
          print(json.dumps({
              "reader_debugger_url_scheme": parsed.scheme,
              "reader_debugger_url_host": parsed.hostname,
              "reader_debugger_url_sha256": hashlib.sha256(url.encode()).hexdigest(),
          }, sort_keys=True))
          PY
          printf '%s' "$DAP_CLIENT_B64" | base64 --decode > "$RUNNER_TEMP/dap_client.py"
          python3 "$RUNNER_TEMP/dap_client.py" \
            --url "$debugger_url" \
            --token "$GH_TOKEN" \
            --mode proof \
            --transcript "$RUNNER_TEMP/reader-dap-transcript.jsonl"
          echo "Safe transcript follows (no URL or token fields):"
          cat "$RUNNER_TEMP/reader-dap-transcript.jsonl"
